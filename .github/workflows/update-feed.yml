name: Update Prom feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install lxml==5.4.0

      - name: Generate XML feed
        env:
          SUPPLIER_FEED_URL: ${{ secrets.SUPPLIER_FEED_URL }}
          OVER_10000_MARKUP: '15'
          PRICE_ROUNDING: 'integer'
        run: |
          test -n "$SUPPLIER_FEED_URL" || exit 1
          mkdir -p public
          python build_prom_feed.py '' public/products.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish XML
        id: deployment
        uses: actions/deploy-pages@v4
